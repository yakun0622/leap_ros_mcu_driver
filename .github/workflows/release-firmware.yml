name: Build & Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：手动发布到指定 Release 标签（例如 v2.2）；留空则仅编译并上传构建产物'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  unit-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run differential kinematics test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I main/config -I main/control \
            tests/differential_kinematics_test.cpp \
            main/control/differential_kinematics.cpp \
            -o /tmp/leap_low_kinematics_test
          /tmp/leap_low_kinematics_test

      - name: Run lidar parser & auto-detection tests
        run: bash tests/run_lidar_tests.sh

      - name: Run micro-ROS time sync tests
        run: |
          cmake -S tests -B /tmp/leap-time-sync-tests
          cmake --build /tmp/leap-time-sync-tests
          ctest --test-dir /tmp/leap-time-sync-tests --output-on-failure

  build-and-release:
    name: Build ESP32-S3 Firmware
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & release metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          SHOULD_RELEASE="false"
          RELEASE_TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${RELEASE_TAG}"
            SHOULD_RELEASE="true"
          elif [ -n "${INPUT_RELEASE_TAG}" ]; then
            if [[ ! "${INPUT_RELEASE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid release_tag format: ${INPUT_RELEASE_TAG}" >&2
              exit 1
            fi
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
            VERSION="${RELEASE_TAG}"
            SHOULD_RELEASE="true"
          else
            VERSION="$(git describe --tags --always)"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: ${VERSION} (release=${SHOULD_RELEASE})"

      - name: Prepare vendored micro-ROS component
        run: |
          sed -i "s|/root/maturo_project/leap_ros|$GITHUB_WORKSPACE|g" dependencies.lock

          # git checkout writes files alphabetically, which leaves micro_ros_src/
          # with a newer mtime than prebuilt libmicroros.a. Restore topological
          # timestamps so libmicroros.mk uses the committed static archive directly.
          UROS_DIR="managed_components/micro_ros_espidf_component"
          touch -c -d "2026-01-01 00:00:00 UTC" "$UROS_DIR/esp32_toolchain.cmake.in"
          touch -c -d "2026-01-01 00:00:01 UTC" \
            "$UROS_DIR/esp32_toolchain.cmake" \
            "$UROS_DIR/micro_ros_dev/install" \
            "$UROS_DIR/micro_ros_src/src"
          touch -c -d "2026-01-01 00:00:02 UTC" "$UROS_DIR/micro_ros_src/install"
          touch -c -d "2026-01-01 00:00:03 UTC" "$UROS_DIR/libmicroros.a"
          make -q -C "$UROS_DIR" -f libmicroros.mk

      - name: Build ESP-IDF firmware
        env:
          FW_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          . /opt/esp/idf/export.sh
          idf.py -DPROJECT_VER="${FW_VERSION}" build

          if [ ! -f build/merged-binary.bin ]; then
            (cd build && esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args)
          fi

      - name: Package firmware artifacts
        env:
          FW_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          version = os.environ["FW_VERSION"]
          commit_sha = os.environ["COMMIT_SHA"][:8]
          build_dir = pathlib.Path("build")
          dist_dir = pathlib.Path("dist")
          dist_dir.mkdir(parents=True, exist_ok=True)

          app_src = build_dir / "leap_ros_mcu_driver.bin"
          merged_src = build_dir / "merged-binary.bin"
          if not app_src.is_file():
              raise SystemExit(f"Missing app binary: {app_src}")
          if not merged_src.is_file():
              raise SystemExit(f"Missing merged binary: {merged_src}")

          prefix = f"leap_ros_mcu_driver-{version}-esp32s3"
          merged_dst = dist_dir / f"{prefix}-merged.bin"
          app_dst = dist_dir / f"{prefix}-app.bin"
          zip_dst = dist_dir / f"{prefix}-package.zip"

          shutil.copy2(merged_src, merged_dst)
          shutil.copy2(app_src, app_dst)

          flasher_args_path = build_dir / "flasher_args.json"
          app_offset = "0x10000"
          flash_entries = []
          if flasher_args_path.is_file():
              flasher = json.loads(flasher_args_path.read_text(encoding="utf-8"))
              app_offset = flasher.get("app", {}).get("offset", app_offset)
              for offset, rel_path in sorted(flasher.get("flash_files", {}).items(), key=lambda x: int(x[0], 16)):
                  flash_entries.append((offset, rel_path))

          bundle_candidates = [
              (merged_src, "merged-binary.bin"),
              (app_src, "leap_ros_mcu_driver.bin"),
              (build_dir / "leap_ros_mcu_driver.elf", "leap_ros_mcu_driver.elf"),
              (build_dir / "bootloader" / "bootloader.bin", "bootloader/bootloader.bin"),
              (build_dir / "partition_table" / "partition-table.bin", "partition_table/partition-table.bin"),
              (build_dir / "ota_data_initial.bin", "ota_data_initial.bin"),
              (build_dir / "flash_args", "flash_args"),
              (flasher_args_path, "flasher_args.json"),
          ]

          with zipfile.ZipFile(zip_dst, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for src, arcname in bundle_candidates:
                  if src.is_file():
                      zf.write(src, arcname=arcname)

          checksum_lines = []
          for artifact in [merged_dst, app_dst, zip_dst]:
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {artifact.name}")
          (dist_dir / "SHA256SUMS.txt").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")

          notes = [
              f"## 固件产物说明 (`{version}`, commit `{commit_sha}`)",
              "",
              "| 文件 | 用途 | 烧录地址 |",
              "| :--- | :--- | :---: |",
              f"| `{merged_dst.name}` | **整包固件**（含 Bootloader、分区表、OTA 初始数据与 App，适合新板首次烧录） | `0x0` |",
              f"| `{app_dst.name}` | **仅 App 固件**（升级时保留板内 NVS 已保存的 Wi-Fi、通信模式和 PID 参数） | `{app_offset}` |",
              f"| `{zip_dst.name}` | **完整构建包**（含分立 `.bin`、`.elf` 符号文件及 `flash_args`） | 见包内 `flash_args` |",
              "| `SHA256SUMS.txt` | 固件文件 SHA-256 校验和 | - |",
              "",
              "### 烧录示例 (`esptool.py`)",
              "",
              "```bash",
              "# 方式 1：整包烧录（从 0x0 写入）",
              f"esptool.py --chip esp32s3 -b 460800 write_flash 0x0 {merged_dst.name}",
              "",
              f"# 方式 2：仅更新应用程序（从 {app_offset} 写入，保留 NVS 配置）",
              f"esptool.py --chip esp32s3 -b 460800 write_flash {app_offset} {app_dst.name}",
              "```",
          ]
          pathlib.Path("RELEASE_NOTES.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          PY
          ls -lh dist/

      - name: Upload firmware artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: leap_ros_mcu_driver-${{ steps.meta.outputs.version }}-esp32s3
          path: dist/*
          if-no-files-found: error

      - name: Publish firmware to GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: leap_ros_mcu_driver ${{ steps.meta.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
